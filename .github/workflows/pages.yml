name: Publish Complete English site
on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  validate:
    name: Validate course content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check shared JavaScript syntax
        run: node --check assets/app.js
      - name: Verify all lesson pages keep chunk activities together
        run: node scripts/validate-lesson-layout.mjs
      - name: Ensure compact generation index matches canonical history
        run: node scripts/build-generation-index.mjs --check
      - name: Verify per-day records and tiny lesson manifest
        run: node scripts/build-lesson-catalog.mjs --check
      - name: Validate lesson registry and drills
        run: node scripts/validate-lessons.mjs
  publish:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
